<div class="contactContainer">
  <h2>Contacto</h2>
  <span>Uno de nuestros asesores se pondrá en contacto contigo </span>
  <div class="infoContainer">
    <form [formGroup]="contactForm" class="contactForm">
      <mat-form-field>
        <mat-label>Nombre</mat-label>
        <input matInput placeholder="Nombre" formControlName="name" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Correo</mat-label>
        <input matInput placeholder="Correo" formControlName="email" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Teléfono</mat-label>
        <input matInput placeholder="Teléfono" formControlName="phone" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Ciudad</mat-label>
        <input matInput placeholder="Ciudad" formControlName="city" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Comentario</mat-label>
        <textarea matInput placeholder="Comentario" formControlName="comment"></textarea>
      </mat-form-field>
      <button mat-raised-button [disabled]="!contactForm.valid" (click)="onSubmitForm()">Enviar</button>
    </form>
    <div>
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3725.625450933531!2d-89.62542552474505!3d20.96755138066647!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8f56715334a60779%3A0x770c2989366a0b5f!2sCatedral%20de%20San%20Ildefonso!5e0!3m2!1ses-419!2smx!4v1718320541185!5m2!1ses-419!2smx" width="450" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>
</div>
